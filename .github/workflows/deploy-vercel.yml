name: Deploy to Vercel

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code before deploying
        run: pnpm check

      - name: Build and deploy
        env:
          VITE_ENABLE_COMPONENT_PREVIEW: ${{ env.DEPLOY_TARGET == 'preview' && 'true' || 'false' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Register VERCEL_TOKEN in repository secrets}"
          : "${VERCEL_ORG_ID:?Register VERCEL_ORG_ID in repository secrets}"
          : "${VERCEL_PROJECT_ID:?Register VERCEL_PROJECT_ID in repository secrets}"

          pnpm exec vercel pull --yes --environment="$DEPLOY_TARGET" --token="$VERCEL_TOKEN"

          if [[ "$DEPLOY_TARGET" == "production" ]]; then
            pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
            DEPLOYMENT_URL=$(pnpm exec vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          else
            pnpm exec vercel build --token="$VERCEL_TOKEN"
            DEPLOYMENT_URL=$(pnpm exec vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          fi

          printf '### Vercel %s\n\n%s\n\nCommit: %s\n' "$DEPLOY_TARGET" "$DEPLOYMENT_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
